compact_prompt = "請產生供下一個上下文接續工作的交接摘要，勿執行原任務或宣告任務完成。以繁體中文保留：\n1. 原始目標、完成條件，以及尚未完成的所有使用者要求。\n2. 最新修正、偏好、限制、已授權的操作與待確認事項；明確區分事實、推測及未決問題。\n3. 已完成的變更、相關檔案完整路徑、重要符號與決策理由。\n4. 驗證指令、結果、尚未驗證事項、既有錯誤及阻塞原因。\n5. 進行中的工具或背景工作識別資訊，以及未提交的變更；不要包含密碼、Token 或其他秘密。\n6. 未完成步驟，並明確指出恢復後第一個可執行動作。\n保留足以繼續工作的具體細節，刪除重複紀錄與冗長工具輸出。最新訊息若只是追問或修正，不得取代原任務，除非使用者明確取消或改變目標。摘要結尾提醒接手者：先恢復狀態，再持續完成已授權的工作；壓縮不是任務結束。\n"
