# gpt-6-astra: 272000 × 80% = 217600 tokens.
# 固定門檻；模型容量變更時請重新計算。
model_auto_compact_token_limit = 217600
model_auto_compact_token_limit_scope = "total"
compact_prompt = "交接摘要必須以以下欄位開頭，逐項填寫，不得省略：\n任務狀態：進行中／已完成／受阻（依實際完成條件判定）\n原始目標：\n完成條件：\n剩餘工作：\n恢復後第一個動作：\n既有授權與限制：\n阻塞原因：無則填無\n\n「恢復後第一個動作」必須是具體操作，包含必要的目標路徑或指令；若已完成則填無，若受阻則寫明解除阻塞所需資訊或動作，不得僅寫「繼續處理」或「確認狀態」。不能僅憑建置通過、diff 檢查完成或摘要已整理，就判定任務完成。\n\n請產生供下一個上下文接續工作的交接摘要，勿執行原任務或宣告任務完成。以繁體中文保留：\n1. 原始目標、完成條件，以及尚未完成的所有使用者要求。\n2. 最新修正、偏好、限制、已授權的操作與待確認事項；明確區分事實、推測及未決問題。\n3. 已完成的變更、相關檔案完整路徑、重要符號與決策理由。\n4. 驗證指令、結果、尚未驗證事項、既有錯誤及阻塞原因。\n5. 進行中的工具或背景工作識別資訊，以及未提交的變更；不要包含密碼、Token 或其他秘密。\n6. 未完成步驟，並明確指出恢復後第一個可執行動作。\n保留足以繼續工作的具體細節，刪除重複紀錄與冗長工具輸出。最新訊息若只是追問或修正，不得取代原任務，除非使用者明確取消或改變目標。摘要結尾提醒接手者：先恢復狀態，再持續完成已授權的工作；壓縮不是任務結束。\n\n恢復後重新出現的工作區規範或環境資訊不是新任務。接手者應先恢復原始任務與既有授權，再執行上述第一個動作；仍有已授權且可執行的未完成工作時，不得只回覆「已收到規範」或重述計畫後結束。\n"
